<!DOCTYPE html>
<html lang="fr" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plateforme Trading - Maurice</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #0a0e17; 
            color: #e0e6ed; 
            min-height: 100vh;
            overflow: hidden; /* Pour que le graphique prenne tout l'écran */
        }
        
        /* BOUTON MENU ASSORTI */
        .btn-nav { 
            position: absolute;
            top: 15px;
            left: 15px;
            z-index: 100;
            text-decoration: none; 
            background: #233357; 
            color: #19c37d; 
            padding: 10px 15px; 
            border-radius: 8px; 
            font-weight: bold; 
            border: 1px solid #19c37d;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .btn-nav:hover { background: #19c37d; color: #233357; }

        #chart-container {
            height: 100vh;
            width: 100vw;
        }
    </style>
</head>
<body>

    <a href="index.html" class="btn-nav">🏠 MENU PRINCIPAL</a>

    <div id="chart-container"></div>

    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <script type="text/javascript">
    new TradingView.widget({
      "autosize": true,
      "symbol": "NASDAQ:NVDA",
      "interval": "D",
      "timezone": "America/New_York",
      "theme": "dark",
      "style": "1",
      "locale": "fr",
      "toolbar_bg": "#f1f3f6",
      "enable_publishing": false,
      "allow_symbol_change": true,
      "container_id": "chart-container",
      "studies": [
        {
          "id": "MASimple@tv-basicstudies",
          "inputs": { "length": 20 },
          "override": { "plot.color": "#4caf50" } // Vert
        },
        {
          "id": "MASimple@tv-basicstudies",
          "inputs": { "length": 50 },
          "override": { "plot.color": "#ff9800" } // Orange
        },
        {
          "id": "MASimple@tv-basicstudies",
          "inputs": { "length": 200 },
          "override": { "plot.color": "#f44336" } // Rouge
        },
        {
          "id": "RSI@tv-basicstudies",
          "inputs": { "length": 14 }
        }
      ]
    });
    </script>
</body>
</html>
