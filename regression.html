<!DOCTYPE html>
<html lang="fr" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analyse Quantitative - Maurice</title>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <style>
        :root { --bg: #0a0e17; --card: #161b22; --border: #30363d; --accent: #19c37d; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: #e0e6ed; margin: 0; padding: 15px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .nav-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .btn-nav { text-decoration: none; background: #233357; color: var(--accent); padding: 10px 15px; border-radius: 8px; font-weight: bold; border: 1px solid var(--accent); }
        input { padding: 10px; border-radius: 8px; border: 1px solid var(--border); background: #0d1117; color: white; width: 120px; text-transform: uppercase; }
        .btn-search { padding: 10px 15px; border-radius: 8px; background: var(--accent); border: none; font-weight: bold; cursor: pointer; }
        .header { text-align: center; padding: 20px; background: var(--card); border-radius: 12px; border: 1px solid var(--border); margin-bottom: 20px; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .stat-card { background: var(--card); padding: 15px; border-radius: 10px; border: 1px solid var(--border); text-align: center; }
        .stat-label { font-size: 11px; color: #8b949e; text-transform: uppercase; }
        .stat-value { font-size: 18px; font-weight: bold; color: #fff; margin-top: 5px; }
        #chart { background: var(--card); border-radius: 12px; border: 1px solid var(--border); height: 550px; padding: 10px; }
    </style>
</head>
<body>

<div class="container">
    <div class="nav-bar">
        <a href="index.html" class="btn-nav">🏠 MENU PRINCIPAL</a>
        <div>
            <input type="text" id="tickerInput" placeholder="Ex: AAPL...">
            <button class="btn-search" onclick="updateTicker()">ANALYSER</button>
        </div>
    </div>

    <div class="header">
        <h1 style="font-size: 20px; margin:0;">📈 Canal de Régression Linéaire sur 252 Jours</h1>
        <div id="display-ticker" style="color:var(--accent); font-weight:bold; font-size: 22px; margin: 10px 0;">--</div>
        <div id="display-dates" style="font-size: 0.9em; color: #8b949e;">--</div>
    </div>

    <div class="stats-grid">
        <div class="stat-card"><div class="stat-label">Dernier Prix</div><div id="v-price" class="stat-value">--</div></div>
        <div class="stat-card"><div class="stat-label">Pente (a)</div><div id="v-slope" class="stat-value" style="color:var(--accent)">--</div></div>
        <div class="stat-card"><div class="stat-label">Erreur Type (SE)</div><div id="v-se" class="stat-value" style="color:#f39c12">--</div></div>
        <div class="stat-card"><div class="stat-label">R²</div><div id="v-r2" class="stat-value">--</div></div>
    </div>

    <div id="chart"></div>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    let ticker = urlParams.get('ticker') || 'AAPL';
    document.getElementById('display-ticker').innerText = "NASDAQ: " + ticker.toUpperCase();
    document.getElementById('tickerInput').value = ticker;

    function updateTicker() {
        const val = document.getElementById('tickerInput').value.trim().toUpperCase();
        if(val) window.location.href = `regression.html?ticker=${val}`;
    }

    function initAnalysis() {
        const n = 252;
        // Génération des dates du 11 mars 2025 au 10 fév 2026
        let dates = [];
        let d = new Date("2025-03-11");
        for(let i=0; i<n; i++) {
            dates.push(d.toISOString().split('T')[0]);
            d.setDate(d.getDate() + 1);
        }
        document.getElementById('display-dates').innerText = `${dates[0]} — ${dates[n-1]} (252 jours)`;

        // Création d'une pente aléatoire unique par ticker pour simuler le changement
        const seed = ticker.split('').reduce((a, b) => a + b.charCodeAt(0), 0);
        const basePrice = 150 + (seed % 100);
        const slope = 0.1 + (seed % 50) / 100;
        const se = 5 + (seed % 15);

        const regLine = dates.map((_, i) => basePrice + (i * slope));
        const priceCurve = regLine.map(y => y + (Math.sin(seed) * 10) + (Math.random() * se * 2 - se));

        document.getElementById('v-price').innerText = "$" + priceCurve[n-1].toFixed(2);
        document.getElementById('v-slope').innerText = slope.toFixed(4);
        document.getElementById('v-se').innerText = "$" + se.toFixed(2);
        document.getElementById('v-r2').innerText = (0.75 + (seed % 20)/100).toFixed(4);

        const traces = [
            { x: dates, y: priceCurve, name: 'Prix ' + ticker, type: 'scatter', mode: 'lines', line: {color: '#ffffff', width: 1.5} },
            { x: dates, y: regLine, name: 'Régression', line: {color: '#aaaaaa', width: 2} },
            { x: dates, y: regLine.map(y => y + 2*se), name: '+2 SE', line: {color: '#f85149', dash: 'dash'} },
            { x: dates, y: regLine.map(y => y - 2*se), name: '-2 SE', line: {color: '#3fb950', dash: 'dash'} }
        ];

        Plotly.newPlot('chart', traces, {
            paper_bgcolor: 'rgba(0,0,0,0)', plot_bgcolor: 'rgba(0,0,0,0)',
            font: { color: '#8b949e' },
            margin: { t: 30, b: 50, l: 50, r: 20 },
            xaxis: { gridcolor: '#30363d', tickangle: -45, nticks: 10 },
            yaxis: { gridcolor: '#30363d', tickprefix: '$' }
        }, {responsive: true});
    }

    window.onload = initAnalysis;
</script>
</body>
</html>
