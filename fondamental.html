<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>ANALYSE FONDAMENTALE COMPLÈTE - ACTIONS</title>
    <style>
        body { background-color: #0d1117; color: white; font-family: sans-serif; padding: 20px; }
        .header-box { border: 1px solid #30363d; border-radius: 8px; padding: 20px; text-align: center; margin-bottom: 20px; background: #161b22; }
        .config-bar { border: 1px dashed #30363d; padding: 15px; border-radius: 8px; display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
        input { background: #0d1117; border: 1px solid #30363d; color: white; padding: 8px; border-radius: 4px; outline: none; }
        input:focus { border-color: #58a6ff; }
        .ticker-bar { display: grid; grid-template-columns: repeat(5, 1fr) auto; gap: 10px; background: #161b22; padding: 10px; border-radius: 8px; }
        .btn-lancer { background-color: #238636; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .btn-lancer:hover { background-color: #2ea043; }
    </style>
</head>
<body>

    <div class="header-box">
        <h1>🏛️ ANALYSE FONDAMENTALE COMPLÈTE - ACTIONS</h1>
        <p>Données TTM 2025-2026 | Seuils de Qualité Maurice</p>
    </div>

    <div class="config-bar">
        🔑 Clé Finnhub : <input type="password" id="apiKey" placeholder="Votre clé ici..." style="width: 250px;">
        <button class="btn-lancer" style="background:#f0f6fc; color:#0d1117; padding: 5px 10px;">💾 SAUVEGARDER</button>
        <span id="status">✅ Prêt</span>
    </div>

    <div class="ticker-bar">
        <input type="text" id="t1" placeholder="ACTION 1 (ex: AAPL)">
        <input type="text" id="t2" placeholder="ACTION 2 (ex: MU)">
        <input type="text" id="t3" placeholder="ACTION 3">
        <input type="text" id="t4" placeholder="ACTION 4">
        <input type="text" id="t5" placeholder="ACTION 5">
        <button class="btn-lancer" onclick="lancerComparaison()">LANCER LA COMPARAISON</button>
    </div>

    <div id="resultats" style="margin-top: 20px;">
        </div>

    <script>
        function lancerComparaison() {
            const key = document.getElementById('apiKey').value;
            const t1 = document.getElementById('t1').value.toUpperCase();
            
            if (!key || !t1) {
                alert("Erreur : Veuillez entrer votre clé ET au moins le premier ticker (Action 1).");
                return;
            }
            
            document.getElementById('resultats').innerHTML = "<p>⏳ Analyse de " + t1 + " en cours...</p>";
            
            // Ici viendra la logique de calcul que nous avons déjà travaillée
            console.log("Lancement de l'analyse pour :", t1);
        }
    </script>

</body>
</html>
