<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Plateforme Trading - Maurice</title>
  <style>
    body { background:#0b1220; margin:0; font-family:sans-serif; }
    .btn-nav { position:absolute; top:10px; left:10px; z-index:10; text-decoration:none; background:#233357; color:#19c37d; padding:10px 15px; border-radius:8px; font-weight:bold; border:1px solid #19c37d; }
    #chart-container { height: 100vh; width: 100vw; }
  </style>
</head>
<body>
  <a href="index.html" class="btn-nav">🏠 MENU PRINCIPAL</a>
  <div id="chart-container"></div>
  <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
  <script type="text/javascript">
    new TradingView.widget({
      "autosize": true, "symbol": "NASDAQ:NVDA", "interval": "D", "timezone": "America/New_York",
      "theme": "dark", "style": "1", "locale": "fr", "container_id": "chart-container",
      "studies": [
        { "id": "MASimple@tv-basicstudies", "inputs": { "length": 20 }, "override": { "plot.color": "#4caf50" } },
        { "id": "MASimple@tv-basicstudies", "inputs": { "length": 50 }, "override": { "plot.color": "#ff9800" } },
        { "id": "MASimple@tv-basicstudies", "inputs": { "length": 200 }, "override": { "plot.color": "#f44336" } },
        { "id": "RSI@tv-basicstudies" }
      ]
    });
  </script>
</body>
</html>
