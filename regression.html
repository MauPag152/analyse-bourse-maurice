<!DOCTYPE html>
<html lang="fr" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analyse Quantitative - Maurice</title>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <style>
        :root { --bg: #0a0e17; --card: #161b22; --border: #30363d; --accent: #19c37d; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: #e0e6ed; margin: 0; padding: 15px; }
        .container { max-width: 1200px; margin: 0 auto; }
        
        /* Navigation et Recherche */
        .nav-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
        .btn-nav { text-decoration: none; background: #233357; color: var(--accent); padding: 10px 15px; border-radius: 8px; font-weight: bold; border: 1px solid var(--accent); }
        .search-box { display: flex; gap: 5px; }
        input { padding: 10px; border-radius: 8px; border: 1px solid var(--border); background: #0d1117; color: white; width: 120px; text-transform: uppercase; }
        .btn-search { padding: 10px 15px; border-radius: 8px; background: var(--accent); border: none; font-weight: bold; cursor: pointer; color: #0a0e17; }

        .header { text-align: center; padding: 20px; background: var(--card); border-radius: 12px; border: 1px solid var(--border); margin-bottom: 20px; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .stat-card { background: var(--card); padding: 15px; border-radius: 10px; border: 1px solid var(--border); text-align: center; }
        .stat-label { font-size: 11px; color: #8b949e; text-transform: uppercase; margin-bottom: 5px; }
        .stat-value { font-size: 18px; font-weight: bold; color: #fff; }

        #chart { background: var(--card); border-radius: 12px; border: 1px solid var(--border); height: 500px; padding: 10px; }
    </style>
</head>
<body>

<div class="container">
    <div class="nav-bar">
        <a href="index.html" class="btn-nav">🏠 MENU PRINCIPAL</a>
        <div class="search-box">
            <input type="text" id="tickerInput" placeholder="Ex: MU, AAPL...">
            <button class="btn-search" onclick="updateTicker()">ANALYSER</button>
        </div>
    </div>

    <div class="header">
        <h1 style="font-size: 22px;">📈 Canal de Régression Linéaire (252 Jours)</h1>
        <div id="display-ticker" style="color:var(--accent); font-weight:bold; font-size: 20px; margin-top:10px;">CHARGEMENT...</div>
    </div>

    <div class="stats-grid" id="statsContainer">
        <div class="stat-card"><div class="stat-label">Cours Actuel</div><div id="v-price" class="stat-value">--</div></div>
        <div class="stat-card"><div class="stat-label">Pente (a)</div><div id="v-slope" class="stat-value" style="color:var(--accent)">--</div></div>
        <div class="stat-card"><div class="stat-label">Erreur Type (SE)</div><div id="v-se" class="stat-value" style="color:#f39c12">--</div></div>
        <div class="stat-card"><div class="stat-label">Coefficient R²</div><div id="v-r2" class="stat-value">--</div></div>
    </div>

    <div id="chart"></div>
</div>

<script>
    // 1. Gestion du Ticker
    const urlParams = new URLSearchParams(window.location.search);
    let currentTicker = urlParams.get('ticker') || 'MU';
    document.getElementById('display-ticker').innerText = currentTicker.toUpperCase();
    document.getElementById('tickerInput').value = currentTicker;

    function updateTicker() {
        const val = document.getElementById('tickerInput').value.trim().toUpperCase();
        if(val) window.location.href = `regression.html?ticker=${val}`;
    }

    // 2. Simulation de données (En attendant votre API réelle)
    function generateData() {
        const n = 252;
        const x = Array.from({length: n}, (_, i) => i);
        // Paramètres basés sur MU (Micron) ou le ticker choisi
        const base = currentTicker === 'MU' ? 140 : 200;
        const slope = 0.3529;
        const se = 14.03;
        
        const regLine = x.map(i => base + (i * slope));
        const priceCurve = x.map(i => base + (i * slope) + (Math.random() * 30 - 15));

        // Mise à jour des chiffres
        document.getElementById('v-price').innerText = "$" + priceCurve[n-1].toFixed(2);
        document.getElementById('v-slope').innerText = slope.toFixed(4);
        document.getElementById('v-se').innerText = "$" + se.toFixed(2);
        document.getElementById('v-r2').innerText = "0.7715";

        const traces = [
            { x: x, y: priceCurve, name: 'Prix ' + currentTicker, type: 'scatter', line: {color: '#ffffff', width: 1.5} },
            { x: x, y: regLine, name: 'Régression', line: {color: '#8b949e', width: 2} },
            { x: x, y: regLine.map(y => y + 2*se), name: '+2 SE', line: {color: '#f85149', dash: 'dash'} },
            { x: x, y: regLine.map(y => y - 2*se), name: '-2 SE', line: {color: '#3fb950', dash: 'dash'} }
        ];

        Plotly.newPlot('chart', traces, {
            paper_bgcolor: 'rgba(0,0,0,0)', plot_bgcolor: 'rgba(0,0,0,0)',
            font: { color: '#8b949e' },
            margin: { t: 20, b: 40, l: 50, r: 20 },
            xaxis: { gridcolor: '#30363d', showgrid: true },
            yaxis: { gridcolor: '#30363d', showgrid: true, tickprefix: '$' }
        }, {responsive: true});
    }

    window.onload = generateData;
</script>
</body>
</html>
