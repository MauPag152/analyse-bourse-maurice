<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPX – S&P 500 | Graphique Boursier</title>
    <script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #ffffff;
            color: #333333;
        }

        /* ─── Bouton Accueil ─── */
        .home-btn {
            position: fixed;
            top: 12px;
            left: 12px;
            z-index: 9999;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 18px;
            background: linear-gradient(135deg, #2962FF, #1565C0);
            color: #fff;
            text-decoration: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            box-shadow: 0 2px 8px rgba(41,98,255,0.35);
            transition: all 0.2s ease;
        }

        .home-btn:hover {
            background: linear-gradient(135deg, #1565C0, #0D47A1);
            box-shadow: 0 4px 14px rgba(41,98,255,0.5);
            transform: translateY(-1px);
        }

        .home-btn .icon {
            font-size: 16px;
        }

        /* ─── Header ─── */
        .header {
            background: #f8f9fa;
            border-bottom: 1px solid #e0e3eb;
            padding: 14px 20px 14px 140px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .symbol-name {
            font-size: 22px;
            font-weight: 700;
            color: #131722;
            letter-spacing: -0.5px;
        }

        .symbol-exchange {
            font-size: 12px;
            color: #787b86;
            font-weight: 500;
        }

        .timeframe-bar {
            display: flex;
            gap: 4px;
        }

        .tf-btn {
            padding: 5px 14px;
            border: 1px solid #d1d4dc;
            border-radius: 4px;
            background: #fff;
            color: #555;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s;
        }

        .tf-btn:hover {
            background: #e8e8e8;
        }

        .tf-btn.active {
            background: #2962FF;
            color: #fff;
            border-color: #2962FF;
        }

        .header-info {
            display: flex;
            gap: 24px;
            align-items: center;
            flex-wrap: wrap;
        }

        .info-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .info-label {
            font-size: 10px;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .info-value {
            font-size: 14px;
            font-weight: 600;
            color: #131722;
        }

        .info-value.green { color: #26a69a; }
        .info-value.red { color: #ef5350; }

        /* ─── Legend overlays ─── */
        .legend-overlay {
            position: absolute;
            top: 8px;
            left: 12px;
            z-index: 100;
            display: flex;
            gap: 14px;
            font-size: 11px;
            font-weight: 600;
            pointer-events: none;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .legend-dot {
            width: 10px;
            height: 3px;
            border-radius: 2px;
        }

        /* ─── Panneaux ─── */
        .chart-section {
            position: relative;
            width: 100%;
            border-bottom: 1px solid #e0e3eb;
        }

        .section-label {
            position: absolute;
            top: 6px;
            right: 14px;
            z-index: 100;
            font-size: 10px;
            font-weight: 700;
            color: #b2b5be;
            text-transform: uppercase;
            letter-spacing: 1px;
            pointer-events: none;
        }

        /* ─── RSI lines labels ─── */
        .rsi-level-labels {
            position: absolute;
            right: 60px;
            z-index: 100;
            font-size: 9px;
            color: #b2b5be;
            pointer-events: none;
        }

        /* ─── Footer ─── */
        .footer {
            text-align: center;
            padding: 10px;
            font-size: 11px;
            color: #b2b5be;
            background: #f8f9fa;
            border-top: 1px solid #e0e3eb;
        }

        /* ─── Responsive ─── */
        @media (max-width: 600px) {
            .header {
                padding: 10px 10px 10px 60px;
            }
            .home-btn {
                padding: 6px 12px;
                font-size: 12px;
            }
            .symbol-name {
                font-size: 17px;
            }
            .header-info {
                gap: 12px;
            }
        }
    </style>
</head>
<body>

    <!-- ─── Bouton Accueil ─── -->
    <a href="index.html" class="home-btn">
        <span class="icon">🏠</span>
        Accueil
    </a>

    <!-- ─── Header ─── -->
    <div class="header">
        <div class="header-left">
            <div>
                <div class="symbol-name">SPX – S&P 500</div>
                <div class="symbol-exchange">INDEX • USD • Données de démonstration</div>
            </div>
            <div class="timeframe-bar">
                <button class="tf-btn" data-tf="1H">1H</button>
                <button class="tf-btn active" data-tf="1D">1D</button>
                <button class="tf-btn" data-tf="1W">1W</button>
                <button class="tf-btn" data-tf="1M">1M</button>
            </div>
        </div>
        <div class="header-info" id="headerInfo">
            <div class="info-item">
                <span class="info-label">Dernier</span>
                <span class="info-value" id="infoClose">—</span>
            </div>
            <div class="info-item">
                <span class="info-label">Variation</span>
                <span class="info-value" id="infoChange">—</span>
            </div>
            <div class="info-item">
                <span class="info-label">Haut</span>
                <span class="info-value" id="infoHigh">—</span>
            </div>
            <div class="info-item">
                <span class="info-label">Bas</span>
                <span class="info-value" id="infoLow">—</span>
            </div>
            <div class="info-item">
                <span class="info-label">Volume</span>
                <span class="info-value" id="infoVol">—</span>
            </div>
        </div>
    </div>

    <!-- ─── Graphique Prix + SMA ─── -->
    <div class="chart-section" id="priceSection">
        <div class="section-label">Prix</div>
        <div class="legend-overlay">
            <div class="legend-item"><div class="legend-dot" style="background:#26a69a"></div>SMA 20</div>
            <div class="legend-item"><div class="legend-dot" style="background:#ff9800"></div>SMA 50</div>
            <div class="legend-item"><div class="legend-dot" style="background:#ef5350"></div>SMA 200</div>
        </div>
        <div id="priceChart"></div>
    </div>

    <!-- ─── Graphique Volume ─── -->
    <div class="chart-section" id="volumeSection">
        <div class="section-label">Volume</div>
        <div id="volumeChart"></div>
    </div>

    <!-- ─── Graphique RSI ─── -->
    <div class="chart-section" id="rsiSection">
        <div class="section-label">RSI (14)</div>
        <div id="rsiChart"></div>
    </div>

    <!-- ─── Footer ─── -->
    <div class="footer">
        Données fictives générées côté client • Lightweight Charts par TradingView • © 2025
    </div>

    <script>
    // ══════════════════════════════════════════════
    //  1. GÉNÉRATION DE DONNÉES DE DÉMONSTRATION
    // ══════════════════════════════════════════════
    function generateDemoData(numDays = 400) {
        const data = [];
        let date = new Date('2023-01-02');
        let close = 3800 + Math.random() * 200;

        for (let i = 0; i < numDays; i++) {
            // Sauter weekends
            while (date.getDay() === 0 || date.getDay() === 6) {
                date.setDate(date.getDate() + 1);
            }

            const trend = 0.15;
            const volatility = close * 0.012;
            const change = (Math.random() - 0.48) * volatility + trend;
            const open = close;
            close = open + change;

            const highExtra = Math.random() * volatility * 0.8;
            const lowExtra = Math.random() * volatility * 0.8;
            const high = Math.max(open, close) + highExtra;
            const low = Math.min(open, close) - lowExtra;

            const baseVolume = 2_500_000_000 + Math.random() * 1_500_000_000;
            const spikeChance = Math.random();
            const volume = spikeChance > 0.95 ? baseVolume * 2.5 : baseVolume;

            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');

            data.push({
                time: `${year}-${month}-${day}`,
                open:  Math.round(open * 100) / 100,
                high:  Math.round(high * 100) / 100,
                low:   Math.round(low * 100) / 100,
                close: Math.round(close * 100) / 100,
                volume: Math.round(volume)
            });

            date.setDate(date.getDate() + 1);
        }
        return data;
    }

    // ══════════════════════════════════════════════
    //  2. CALCUL SMA
    // ══════════════════════════════════════════════
    function calcSMA(data, period) {
        const result = [];
        for (let i = 0; i < data.length; i++) {
            if (i < period - 1) continue;
            let sum = 0;
            for (let j = i - period + 1; j <= i; j++) {
                sum += data[j].close;
            }
            result.push({
                time: data[i].time,
                value: Math.round((sum / period) * 100) / 100
            });
        }
        return result;
    }

    // ══════════════════════════════════════════════
    //  3. CALCUL RSI
    // ══════════════════════════════════════════════
    function calcRSI(data, period = 14) {
        const result = [];
        if (data.length < period + 1) return result;

        let gains = 0, losses = 0;

        // Première moyenne
        for (let i = 1; i <= period; i++) {
            const diff = data[i].close - data[i - 1].close;
            if (diff >= 0) gains += diff;
            else losses -= diff;
        }

        let avgGain = gains / period;
        let avgLoss = losses / period;

        for (let i = period; i < data.length; i++) {
            if (i > period) {
                const diff = data[i].close - data[i - 1].close;
                const gain = diff >= 0 ? diff : 0;
                const loss = diff < 0 ? -diff : 0;
                avgGain = (avgGain * (period - 1) + gain) / period;
                avgLoss = (avgLoss * (period - 1) + loss) / period;
            }

            const rs = avgLoss === 0 ? 100 : avgGain / avgLoss;
            const rsi = avgLoss === 0 ? 100 : 100 - (100 / (1 + rs));

            result.push({
                time: data[i].time,
                value: Math.round(rsi * 100) / 100
            });
        }
        return result;
    }

    // ══════════════════════════════════════════════
    //  4. DONNÉES
    // ══════════════════════════════════════════════
    const rawData = generateDemoData(400);
    const sma20  = calcSMA(rawData, 20);
    const sma50  = calcSMA(rawData, 50);
    const sma200 = calcSMA(rawData, 200);
    const rsiData = calcRSI(rawData, 14);

    const candleData = rawData.map(d => ({
        time: d.time, open: d.open, high: d.high, low: d.low, close: d.close
    }));

    const volumeData = rawData.map(d => ({
        time: d.time,
        value: d.volume,
        color: d.close >= d.open ? 'rgba(38,166,154,0.5)' : 'rgba(239,83,80,0.5)'
    }));

    // Mise à jour header
    const lastBar = rawData[rawData.length - 1];
    const prevBar = rawData[rawData.length - 2];
    const pctChange = ((lastBar.close - prevBar.close) / prevBar.close * 100);
    document.getElementById('infoClose').textContent = lastBar.close.toFixed(2);

    const changeEl = document.getElementById('infoChange');
    changeEl.textContent = (pctChange >= 0 ? '+' : '') + pctChange.toFixed(2) + '%';
    changeEl.className = 'info-value ' + (pctChange >= 0 ? 'green' : 'red');

    document.getElementById('infoHigh').textContent = lastBar.high.toFixed(2);
    document.getElementById('infoLow').textContent  = lastBar.low.toFixed(2);
    document.getElementById('infoVol').textContent = (lastBar.volume / 1e9).toFixed(2) + 'B';

    // ══════════════════════════════════════════════
    //  5. DIMENSIONS RÉACTIVES
    // ══════════════════════════════════════════════
    function getChartWidth() {
        return window.innerWidth;
    }

    function getPriceHeight() {
        return Math.max(300, window.innerHeight * 0.50);
    }

    function getVolumeHeight() {
        return Math.max(100, window.innerHeight * 0.14);
    }

    function getRsiHeight() {
        return Math.max(120, window.innerHeight * 0.18);
    }

    // ══════════════════════════════════════════════
    //  6. OPTIONS COMMUNES
    // ══════════════════════════════════════════════
    const commonOptions = {
        layout: {
            background: { type: 'solid', color: '#ffffff' },
            textColor: '#787b86',
            fontSize: 11,
        },
        grid: {
            vertLines: { color: '#f0f0f0' },
            horzLines: { color: '#f0f0f0' },
        },
        crosshair: {
            mode: LightweightCharts.CrosshairMode.Normal,
            vertLine: {
                color: '#9598a1',
                width: 1,
                style: LightweightCharts.LineStyle.Dashed,
                labelBackgroundColor: '#2962FF',
            },
            horzLine: {
                color: '#9598a1',
                width: 1,
                style: LightweightCharts.LineStyle.Dashed,
                labelBackgroundColor: '#2962FF',
            },
        },
        rightPriceScale: {
            borderColor: '#e0e3eb',
            scaleMargins: { top: 0.05, bottom: 0.05 },
        },
        timeScale: {
            borderColor: '#e0e3eb',
            timeVisible: false,
            rightOffset: 5,
            barSpacing: 6,
        },
        handleScroll: { vertTouchDrag: false },
    };

    // ══════════════════════════════════════════════
    //  7. GRAPHIQUE PRIX + SMA
    // ══════════════════════════════════════════════
    const priceChart = LightweightCharts.createChart(
        document.getElementById('priceChart'), {
            ...commonOptions,
            width: getChartWidth(),
            height: getPriceHeight(),
        }
    );

    const candleSeries = priceChart.addCandlestickSeries({
        upColor: '#26a69a',
        downColor: '#ef5350',
        borderUpColor: '#26a69a',
        borderDownColor: '#ef5350',
        wickUpColor: '#26a69a',
        wickDownColor: '#ef5350',
    });
    candleSeries.setData(candleData);

    // SMA 20 – vert
    const sma20Series = priceChart.addLineSeries({
        color: '#26a69a',
        lineWidth: 2,
        priceLineVisible: false,
        lastValueVisible: false,
        crosshairMarkerVisible: false,
    });
    sma20Series.setData(sma20);

    // SMA 50 – orange
    const sma50Series = priceChart.addLineSeries({
        color: '#ff9800',
        lineWidth: 2,
        priceLineVisible: false,
        lastValueVisible: false,
        crosshairMarkerVisible: false,
    });
    sma50Series.setData(sma50);

    // SMA 200 – rouge
    const sma200Series = priceChart.addLineSeries({
        color: '#ef5350',
        lineWidth: 2,
        priceLineVisible: false,
        lastValueVisible: false,
        crosshairMarkerVisible: false,
    });
    sma200Series.setData(sma200);

    // ══════════════════════════════════════════════
    //  8. GRAPHIQUE VOLUME
    // ══════════════════════════════════════════════
    const volumeChart = LightweightCharts.createChart(
        document.getElementById('volumeChart'), {
            ...commonOptions,
            width: getChartWidth(),
            height: getVolumeHeight(),
            rightPriceScale: {
                borderColor: '#e0e3eb',
                scaleMargins: { top: 0.1, bottom: 0 },
            },
        }
    );

    const volumeSeries = volumeChart.addHistogramSeries({
        priceFormat: { type: 'volume' },
        priceLineVisible: false,
        lastValueVisible: false,
    });
    volumeSeries.setData(volumeData);

    // ══════════════════════════════════════════════
    //  9. GRAPHIQUE RSI
    // ══════════════════════════════════════════════
    const rsiChartEl = document.getElementById('rsiChart');
    const rsiChart = LightweightCharts.createChart(rsiChartEl, {
        ...commonOptions,
        width: getChartWidth(),
        height: getRsiHeight(),
        layout: {
            background: { type: 'solid', color: '#fafafa' },
            textColor: '#787b86',
            fontSize: 11,
        },
        rightPriceScale: {
            borderColor: '#e0e3eb',
            scaleMargins: { top: 0.08, bottom: 0.08 },
        },
    });

    const rsiSeries = rsiChart.addLineSeries({
        color: '#131722',
        lineWidth: 2,
        priceLineVisible: false,
        lastValueVisible: true,
        crosshairMarkerVisible: true,
    });
    rsiSeries.setData(rsiData);

    // Lignes RSI 70 et 30
    rsiSeries.createPriceLine({
        price: 70,
        color: '#ef5350',
        lineWidth: 1,
        lineStyle: LightweightCharts.LineStyle.Dashed,
        axisLabelVisible: true,
        title: '',
    });

    rsiSeries.createPriceLine({
        price: 30,
        color: '#26a69a',
        lineWidth: 1,
        lineStyle: LightweightCharts.LineStyle.Dashed,
        axisLabelVisible: true,
        title: '',
    });

    // Ligne médiane 50
    rsiSeries.createPriceLine({
        price: 50,
        color: '#b2b5be',
        lineWidth: 1,
        lineStyle: LightweightCharts.LineStyle.Dotted,
        axisLabelVisible: false,
        title: '',
    });

    // ══════════════════════════════════════════════
    //  10. SYNCHRONISATION DES AXES DE TEMPS
    // ══════════════════════════════════════════════
    function syncCharts(sourceChart, targets) {
        sourceChart.timeScale().subscribeVisibleLogicalRangeChange(range => {
            if (range === null) return;
            targets.forEach(tc => {
                tc.timeScale().setVisibleLogicalRange(range);
            });
        });
    }

    syncCharts(priceChart, [volumeChart, rsiChart]);
    syncCharts(volumeChart, [priceChart, rsiChart]);
    syncCharts(rsiChart, [priceChart, volumeChart]);

    // Synchroniser le crosshair
    function syncCrosshair(sourceChart, sourceSeries, targets) {
        sourceChart.subscribeCrosshairMove(param => {
            targets.forEach(({ chart, series }) => {
                if (!param || !param.time) {
                    chart.clearCrosshairPosition();
                    return;
                }
                const dataPoint = param.seriesData?.get(sourceSeries);
                if (dataPoint) {
                    const price = dataPoint.close !== undefined ? dataPoint.close : dataPoint.value;
                    // On ne peut pas parfaitement sync le crosshair sur l'autre chart
                    // sans setCrosshairPosition (v4 ne l'expose pas publiquement de manière fiable)
                    // On garde la sync temporelle par visibleLogicalRange.
                }
            });
        });
    }

    // ══════════════════════════════════════════════
    //  11. BOUTONS TIMEFRAME (visuel seulement)
    // ══════════════════════════════════════════════
    document.querySelectorAll('.tf-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.tf-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        });
    });

    // ══════════════════════════════════════════════
    //  12. REDIMENSIONNEMENT RÉACTIF
    // ══════════════════════════════════════════════
    window.addEventListener('resize', () => {
        const w = getChartWidth();
        priceChart.applyOptions({ width: w, height: getPriceHeight() });
        volumeChart.applyOptions({ width: w, height: getVolumeHeight() });
        rsiChart.applyOptions({ width: w, height: getRsiHeight() });
    });

    // Ajuster le zoom initial
    priceChart.timeScale().fitContent();
    volumeChart.timeScale().fitContent();
    rsiChart.timeScale().fitContent();

    </script>
</body>
</html>
