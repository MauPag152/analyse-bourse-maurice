<!DOCTYPE html>
<html lang="fr" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Régression Linéaire - Maurice</title>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0a0e17; color: #e0e6ed; padding: 20px; margin: 0; }
        .container { max-width: 1100px; margin: 0 auto; }
        .btn-nav { 
            display: inline-block; margin-bottom: 20px; text-decoration: none; 
            background: #233357; color: #19c37d; padding: 10px 15px; 
            border-radius: 8px; font-weight: bold; border: 1px solid #19c37d; 
        }
        .header-card { background: #161b22; border: 1px solid #30363d; border-radius: 16px; padding: 20px; text-align: center; margin-bottom: 20px; }
        input { padding: 12px; border-radius: 8px; border: 1px solid #30363d; background: #0d1117; color: white; width: 200px; font-size: 16px; }
        button { padding: 12px 20px; border-radius: 8px; background: #19c37d; border: none; font-weight: bold; cursor: pointer; margin-left: 10px; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .stat-box { background: #161b22; border: 1px solid #30363d; padding: 20px; border-radius: 12px; text-align: center; }
        .stat-label { color: #8b949e; font-size: 12px; text-transform: uppercase; }
        .stat-value { font-size: 22px; font-weight: bold; color: #ffffff; margin-top: 8px; }
        #chart { background: #161b22; border-radius: 16px; border: 1px solid #30363d; height: 550px; }
    </style>
</head>
<body>
<div class="container">
    <a href="index.html" class="btn-nav">🏠 MENU PRINCIPAL</a>
    <div class="header-card">
        <h1 style="font-size: 24px; margin-bottom: 15px;">📈 Canal de Régression Linéaire (252 Jours)</h1>
        <input type="text" id="tickerInput" placeholder="Ex: MU, NVDA, TSLA...">
        <button onclick="updateTicker()">ANALYSER</button>
    </div>
    <div class="stats-grid">
        <div class="stat-box"><div class="stat-label">Symbole</div><div class="stat-value" id="disp-ticker">--</div></div>
        <div class="stat-box"><div class="stat-label">Pente (a)</div><div class="stat-value" style="color:#19c37d" id="val-slope">--</div></div>
        <div class="stat-box"><div class="stat-label">Erreur Type (SE)</div><div class="stat-value" style="color:#f39c12" id="val-se">--</div></div>
        <div class="stat-box"><div class="stat-label">R²</div><div class="stat-value" id="val-r2">--</div></div>
    </div>
    <div id="chart"></div>
</div>
<script>
    const urlParams = new URLSearchParams(window.location.search);
    let ticker = urlParams.get('ticker') || 'AAPL';
    document.getElementById('tickerInput').value = ticker;
    document.getElementById('disp-ticker').innerText = ticker.toUpperCase();

    function updateTicker() {
        const val = document.getElementById('tickerInput').value.trim().toUpperCase();
        if(val) window.location.href = `regression.html?ticker=${val}`;
    }

    function draw() {
        const n = 252; const x = Array.from({length: n}, (_, i) => i);
        const startPrice = 180; const slope = 0.28; const se = 14.5;
        const prices = x.map(i => startPrice + (i * slope) + (Math.random() * 25 - 12.5));
        const reg = x.map(i => startPrice + (i * slope));
        
        document.getElementById('val-slope').innerText = slope.toFixed(4);
        document.getElementById('val-se').innerText = "$" + se.toFixed(2);
        document.getElementById('val-r2').innerText = "0.85";

        const traces = [
            { x: x, y: prices, name: ticker, type: 'scatter', line: {color: '#ffffff', width: 1.5} },
            { x: x, y: reg, name: 'Médiane', line: {color: '#e0e6ed', width: 2} },
            { x: x, y: reg.map(v => v + 2*se), name: '+2 SE (Vente)', line: {color: '#f85149', dash: 'dash'} },
            { x: x, y: reg.map(v => v + se), name: '+1 SE', line: {color: '#f39c12', dash: 'dot'} },
            { x: x, y: reg.map(v => v - se), name: '-1 SE', line: {color: '#2188ff', dash: 'dot'} },
            { x: x, y: reg.map(v => v - 2*se), name: '-2 SE (Achat)', line: {color: '#3fb950', dash: 'dash'} }
        ];

        Plotly.newPlot('chart', traces, {
            paper_bgcolor: '#161b22', plot_bgcolor: '#161b22',
            font: { color: '#8b949e' }, margin: { t: 40, b: 60, l: 60, r: 40 },
            xaxis: { gridcolor: '#30363d' }, yaxis: { gridcolor: '#30363d', tickprefix: '$' }
        });
    }
    window.onload = draw;
</script>
</body>
</html>
