<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plateforme Trading - Maurice</title>
    <style>
        /* On utilise toute la hauteur de l'écran sans créer de défilement inutile */
        body { 
            margin: 0; 
            padding: 0; 
            background-color: #0d1117; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            overflow: hidden; 
        }
        
        /* Barre de navigation fixe en haut */
        .top-nav {
            height: 50px;
            background: #161b22;
            display: flex;
            align-items: center;
            padding: 0 20px;
            border-bottom: 1px solid #30363d;
            z-index: 1000;
        }

        .btn-nav {
            text-decoration: none;
            background: #233357;
            color: #19c37d;
            padding: 6px 15px;
            border-radius: 6px;
            font-weight: bold;
            border: 1px solid #19c37d;
            font-family: sans-serif;
            font-size: 14px;
        }

        /* Le conteneur s'ajuste pour laisser le RSI visible en bas */
        .chart-container {
            flex-grow: 1; 
            width: 100%;
            height: calc(100vh - 50px);
        }
    </style>
</head>
<body>

    <div class="top-nav">
        <a href="index.html" class="btn-nav">🏠 MENU PRINCIPAL</a>
        <span style="color: #8b949e; margin-left: 20px; font-family: sans-serif; font-size: 14px;">Analyse Technique en Temps Réel</span>
    </div>

    <div class="chart-container">
        <div id="tradingview_chart" style="height: 100%; width: 100%;"></div>
        <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
        <script type="text/javascript">
            new TradingView.widget({
                "autosize": true,
                "symbol": "NASDAQ:NVDA",
                "interval": "D",
                "timezone": "America/New_York",
                "theme": "dark",
                "style": "1",
                "locale": "fr",
                "toolbar_bg": "#131722",
                "enable_publishing": false,
                "hide_side_toolbar": false,
                "allow_symbol_change": true,
                "container_id": "tradingview_chart",
                // On active les études par défaut pour forcer l'affichage si besoin
                "studies": [
                    "RSI@tv-basicstudies"
                ]
            });
        </script>
    </div>

</body>
</html>
