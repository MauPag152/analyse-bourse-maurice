<!DOCTYPE html>
<html lang="fr" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analyse Fondamentale - Maurice</title>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <style>
        :root { --bg: #0a0e17; --card: #161b22; --border: #30363d; --accent: #19c37d; --danger: #f85149; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: #e0e6ed; margin: 0; padding: 0; }
        
        .top-nav { height: 50px; background: #161b22; display: flex; align-items: center; padding: 0 20px; border-bottom: 1px solid var(--border); }
        .btn-nav { text-decoration: none; background: #233357; color: var(--accent); padding: 6px 15px; border-radius: 6px; font-weight: bold; border: 1px solid var(--accent); }

        .container { max-width: 1400px; margin: 20px auto; padding: 0 20px; }
        
        /* Section Configuration Clé */
        .config-area { 
            background: #1c2128; 
            padding: 10px 20px; 
            border-radius: 8px; 
            margin-bottom: 20px; 
            display: flex; 
            align-items: center; 
            gap: 15px;
            border: 1px dashed var(--border);
        }

        .ratios-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .ratio-card { background: var(--card); padding: 15px; border-radius: 10px; border: 1px solid var(--border); text-align: center; }
        .ratio-label { font-size: 11px; color: #8b949e; text-transform: uppercase; }
        .ratio-value { font-size: 18px; font-weight: bold; color: var(--accent); margin-top: 5px; }

        .search-area { background: var(--card); padding: 20px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 20px; display: flex; gap: 10px; }
        input { padding: 10px; border-radius: 6px; border: 1px solid var(--border); background: #0d1117; color: white; }
        .input-ticker { flex-grow: 1; text-transform: uppercase; }
        
        .btn-search { background: var(--accent); color: #0a0e17; border: none; padding: 0 30px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .btn-save { background: #30363d; color: white; border: 1px solid var(--border); padding: 5px 15px; border-radius: 4px; cursor: pointer; font-size: 12px; }

        .charts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .chart-box { background: var(--card); padding: 15px; border-radius: 12px; border: 1px solid var(--border); height: 350px; }
    </style>
</head>
<body>

    <div class="top-nav">
        <a href="index.html" class="btn-nav">🏠 MENU PRINCIPAL</a>
        <div style="margin-left: 20px; font-size: 14px; color: #8b949e;">Analyse Fondamentale de Maurice</div>
    </div>

    <div class="container">
        <div class="config-area">
            <span style="font-size: 12px; color: #8b949e;">🔑 CLÉ FINNHUB :</span>
            <input type="password" id="apiKeyInput" placeholder="Collez votre clé ici..." style="width: 250px; font-size: 12px;">
            <button class="btn-save" onclick="saveKey()">💾 SAUVEGARDER LA CLÉ</button>
            <span id="keyStatus" style="font-size: 11px; color: var(--accent);"></span>
        </div>

        <div class="search-area">
            <input type="text" id="tickerInput" class="input-ticker" placeholder="SYMBOLE (EX: MU, AAPL, TSLA)...">
            <button class="btn-search" onclick="fetchFinancials()">LANCER L'ANALYSE</button>
        </div>

        <div class="ratios-grid">
            <div class="ratio-card"><div class="ratio-label">P/E Ratio</div><div id="pe" class="ratio-value">--</div></div>
            <div class="ratio-card"><div class="ratio-label">PEG Ratio</div><div id="peg" class="ratio-value">--</div></div>
            <div class="ratio-card"><div class="ratio-label">ROE (%)</div><div id="roe" class="ratio-value">--</div></div>
            <div class="ratio-card"><div class="ratio-label">Dette / Équité</div><div id="debt" class="ratio-value">--</div></div>
            <div class="ratio-card"><div class="ratio-label">Marge Nette (%)</div><div id="margin" class="ratio-value">--</div></div>
            <div class="ratio-card"><div class="ratio-label">Price/Book</div><div id="pb" class="ratio-value">--</div></div>
            <div class="ratio-card"><div class="ratio-label">Current Ratio</div><div id="current" class="ratio-value">--</div></div>
            <div class="ratio-card"><div class="ratio-label">Div. Yield (%)</div><div id="yield" class="ratio-value">--</div></div>
        </div>

        <div class="charts-grid">
            <div id="chart1" class="chart-box"></div>
            <div id="chart2" class="chart-box"></div>
        </div>
    </div>

<script>
    // Chargement automatique de la clé sauvegardée au démarrage
    window.onload = function() {
        const savedKey = localStorage.getItem('finnhub_key');
        if(savedKey) {
            document.getElementById('apiKeyInput').value = savedKey;
            document.getElementById('keyStatus').innerText = "✅ Clé chargée";
        }
    };

    function saveKey() {
        const key = document.getElementById('apiKeyInput').value.trim();
        if(key) {
            localStorage.setItem('finnhub_key', key);
            document.getElementById('keyStatus').innerText = "✅ Clé sauvegardée !";
            setTimeout(() => { document.getElementById('keyStatus').innerText = "✅ Clé chargée"; }, 3000);
        }
    }

    async function fetchFinancials() {
        const ticker = document.getElementById('tickerInput').value.toUpperCase();
        const apiKey = localStorage.getItem('finnhub_key');

        if(!apiKey) {
            alert("Veuillez saisir et sauvegarder votre clé Finnhub en haut de la page.");
            return;
        }
        if(!ticker) return;

        try {
            const response = await fetch(`https://finnhub.io/api/v1/stock/metric?symbol=${ticker}&metric=all&token=${apiKey}`);
            const data = await response.json();
            const m = data.metric;

            if(!m) { alert("Données non trouvées pour ce symbole."); return; }

            document.getElementById('pe').innerText = m['peBasicExclExtraTTM']?.toFixed(2) || 'N/A';
            document.getElementById('peg').innerText = m['pegTTM']?.toFixed(2) || 'N/A';
            document.getElementById('roe').innerText = m['roeTTM']?.toFixed(2) + '%' || 'N/A';
            document.getElementById('debt').innerText = m['totalDebt/totalEquityQuarterly']?.toFixed(2) || 'N/A';
            document.getElementById('margin').innerText = m['netProfitMarginTTM']?.toFixed(2) + '%' || 'N/A';
            document.getElementById('pb').innerText = m['pbQuarterly']?.toFixed(2) || 'N/A';
            document.getElementById('current').innerText = m['currentRatioQuarterly']?.toFixed(2) || 'N/A';
            document.getElementById('yield').innerText = m['dividendYieldIndicatedAnnual']?.toFixed(2) + '%' || 'N/A';

            updateCharts(ticker);
        } catch (e) { 
            console.error("Erreur API", e);
            alert("Erreur lors de la récupération des données. Vérifiez votre clé.");
        }
    }

    function updateCharts(ticker) {
        const years = ['2021', '2022', '2023', '2024'];
        Plotly.newPlot('chart1', [{ x: years, y: [50, 65, 80, 95], type: 'bar', marker: {color: '#19c37d'} }], 
            { title: `Revenus (Milliards) - ${ticker}`, paper_bgcolor: 'rgba(0,0,0,0)', plot_bgcolor: 'rgba(0,0,0,0)', font: {color: '#8b949e'} });
        
        Plotly.newPlot('chart2', [{ x: years, y: [12, 18, 15, 22], type: 'scatter', mode: 'lines+markers', line: {color: '#f39c12'} }], 
            { title: `Bénéfice Net - ${ticker}`, paper_bgcolor: 'rgba(0,0,0,0)', plot_bgcolor: 'rgba(0,0,0,0)', font: {color: '#8b949e'} });
    }
</script>
</body>
</html>
